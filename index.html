<!DOCTYPE html>
<html>
<head>
<title>Text Prediction App</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
  .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
  input[type="text"] { width: 300px; padding: 10px; font-size: 16px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; }
  button { padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
  button:hover { background-color: #0056b3; }
  h2 { color: #333; }
  #result { margin-top: 20px; font-size: 20px; font-weight: bold; color: #28a745; }
</style>
</head>
<body>

<div class="container">
  <h2>Data Science Text Prediction App</h2>
  <p>Enter a phrase below, and the algorithm will predict the next word.</p>
  
  <input type="text" id="userInput" placeholder="e.g., I want to go to the">
  <br>
  <button onclick="predictWord()">Submit</button>
  
  <div id="result"></div>
</div>

<script>
  function predictWord() {
    var input = document.getElementById("userInput").value.toLowerCase();
    var resultDiv = document.getElementById("result");
    
    if (input === "") {
      resultDiv.innerHTML = "Please enter some text.";
      resultDiv.style.color = "red";
      return;
    }

    resultDiv.innerHTML = "Calculating...";
    resultDiv.style.color = "blue";

    // Simulate the delay of a prediction algorithm
    setTimeout(function() {
      var prediction = "the"; // Default
      
      if (input.includes("happy")) { prediction = "birthday"; }
      else if (input.includes("data")) { prediction = "science"; }
      else if (input.includes("machine")) { prediction = "learning"; }
      else if (input.includes("thank")) { prediction = "you"; }
      else if (input.includes("good")) { prediction = "morning"; }
      
      resultDiv.innerHTML = "Predicted Next Word: <br><span style='color:#28a745'>" + prediction + "</span>";
      resultDiv.style.color = "#333";
    }, 1000); 
  }
</script>

</body>
</html>
